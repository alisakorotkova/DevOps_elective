apiVersion: v1
kind: ConfigMap
metadata:
  name: lab5-webhook-receiver-code
  namespace: monitoring
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import sys

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length).decode("utf-8", errors="replace")

            print("\n=== ALERTMANAGER WEBHOOK RECEIVED ===", flush=True)
            print(body, flush=True)
            print("=== END ===\n", flush=True)

            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"webhook receiver is running")

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab5-webhook-receiver
  namespace: monitoring
  labels:
    app: lab5-webhook-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab5-webhook-receiver
  template:
    metadata:
      labels:
        app: lab5-webhook-receiver
    spec:
      containers:
        - name: webhook-receiver
          image: python:3.11-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: lab5-webhook-receiver-code
---
apiVersion: v1
kind: Service
metadata:
  name: lab5-webhook-receiver
  namespace: monitoring
  labels:
    app: lab5-webhook-receiver
spec:
  selector:
    app: lab5-webhook-receiver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
